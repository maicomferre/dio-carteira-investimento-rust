services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: carteira_dev
      POSTGRES_USER: carteira_app
      POSTGRES_PASSWORD: carteira_app_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carteira_postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira_app -d carteira_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carteira_postgres_18_data:
