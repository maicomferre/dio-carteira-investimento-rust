<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar cadastro | Carteira de Investimentos</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/vendor/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body class="bg-body-tertiary">
    <main class="auth-shell container">
      <section class="auth-card card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center">
            <img class="auth-logo" src="/static/img/logo.png" alt="Carteira de Investimentos">
            <p class="text-uppercase text-primary small mb-1">Carteira de Investimentos</p>
            <h1 class="h3 mb-3">Criar cadastro</h1>
          </div>
          <form method="post" action="/register" data-auth-form="/auth/register" novalidate>
            <div class="alert alert-danger" role="alert" tabindex="-1" data-form-status hidden></div>
            <div class="mb-3">
              <label class="form-label" for="username">Usuário</label>
              <input class="form-control" id="username" name="username" autocomplete="username" minlength="3" maxlength="64" required aria-describedby="username-help username-error">
              <div class="form-text" id="username-help">Use letras, números, ponto, hífen ou sublinhado.</div>
              <div class="invalid-feedback" id="username-error" data-error-for="username" hidden></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Senha</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-help password-error">
              <div class="form-text" id="password-help">Mínimo de 12 caracteres.</div>
              <div class="invalid-feedback" id="password-error" data-error-for="password" hidden></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Cadastrar e entrar</button>
          </form>
          <p class="mt-3 mb-0 small">Já tem conta? <a href="/login">Entrar</a></p>
        </div>
      </section>
      <div class="visually-hidden" aria-live="polite" data-live-region></div>
    </main>
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
    <script src="/static/vendor/sweetalert2/sweetalert2.all.min.js" defer></script>
    <script type="module" src="/static/dist/app.js"></script>
  </body>
</html>
