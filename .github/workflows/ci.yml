name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: carteira_test
          POSTGRES_USER: carteira_app
          POSTGRES_PASSWORD: carteira_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carteira_app -d carteira_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://carteira_app:carteira_app_test_password@localhost:5432/carteira_test
      APP_ENV: test
      APP_BIND_ADDR: 127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
      - run: sqlx migrate run
