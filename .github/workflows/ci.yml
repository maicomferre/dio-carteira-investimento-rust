name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://carteira_runtime:carteira_runtime_dev_password@127.0.0.1:5433/carteira_dev
      DATABASE_MIGRATION_URL: postgres://carteira_migrator:carteira_migrator_dev_password@127.0.0.1:5433/carteira_dev
      APP_ENV: test
      APP_BIND_ADDR: 127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ts
      - run: npm run build
      - run: npm run audit:public-boundary
      - run: npm audit --audit-level=moderate
      - run: cargo fmt --all -- --check
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - run: docker compose -f docker-compose.dev.yml up -d --wait
      - run: npm run db:migrate
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check
